services:
  # Secure Docker API proxy limiting container permissions (SBX-01)
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: chege-docker-proxy
    environment:
      - CONTAINERS=1
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=0
      - VOLUMES=0
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - chege-net

  chege-agent:
    build: .
    image: chege-agent:0.2.0
    container_name: chege-agent
    ports:
      # Loopback only — the app has no authentication by design.
      - "127.0.0.1:${CHEGE_PORT:-8000}:8000"
    environment:
      - CHEGE_HOST=0.0.0.0
      - CHEGE_PORT=8000
      # Empty => embedded SQLite. Filled by --with-postgres in deploy.sh.
      - CHEGE_DATABASE_URL=${CHEGE_DATABASE_URL:-}
      - CHEGE_DATA_DIR=/app/data
      - CHEGE_WORKDIR=/app/workdir
      - CHEGE_LOGS_DIR=/app/logs
      - CHEGE_SANDBOX_BACKEND=${CHEGE_SANDBOX_BACKEND:-docker}
      - CHEGE_DOCKER_SOCKET_PROXY=${CHEGE_DOCKER_SOCKET_PROXY:-tcp://docker-socket-proxy:2375}
      - CHEGE_DEFAULT_SANDBOX_IMAGE=${CHEGE_DEFAULT_SANDBOX_IMAGE:-chege-sandbox-polyglot:latest}
      - CHEGE_DEFAULT_PROVIDER=${CHEGE_DEFAULT_PROVIDER:-llama_cpp}
      - CHEGE_LLAMACPP_URL=http://host.docker.internal:8080/v1
      - CHEGE_LLAMACPP_CONTROL_URL=http://host.docker.internal:8081
      - CHEGE_OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      # Persistent application data and workspace directories
      - ./data:/app/data
      - ./workdir:/app/workdir
      - ./logs:/app/logs
    depends_on:
      - docker-socket-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chege-net

networks:
  chege-net:
    driver: bridge
