[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chege-agent"
version = "0.2.0"
description = "A general-purpose, self-hostable agent harness for coding and tool workflows."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Chege Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlmodel>=0.0.21",
    "httpx>=0.27.0",
    "ollama>=0.3.0",
    "structlog>=24.4.0",
    "pathspec>=0.12.0",
    "aiofiles>=24.1.0",
    "psycopg[binary]>=3.2.0",
    "docker>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]
