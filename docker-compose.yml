name: chege-agent

services:
  # Secure Docker API proxy limiting container permissions (SBX-01)
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: chege-agent-docker-proxy
    environment:
      - CONTAINERS=1
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=0
      - VOLUMES=0
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - chege-net

  chege-agent:
    build: .
    image: chege-agent-web:0.2.0
    container_name: chege-agent-web
    ports:
      # Loopback only — the app has no authentication by design.
      - "127.0.0.1:${CHEGE_PORT:-8000}:8000"
    environment:
      - CHEGE_HOST=0.0.0.0
      - CHEGE_PORT=8000
      # Empty => embedded SQLite. Filled by --with-postgres in deploy.sh.
      - CHEGE_DATABASE_URL=${CHEGE_DATABASE_URL:-}
      - CHEGE_DATA_DIR=/app/data
      - CHEGE_WORKDIR=/app/workdir
      - CHEGE_LOGS_DIR=/app/logs
      - CHEGE_SANDBOX_BACKEND=${CHEGE_SANDBOX_BACKEND:-docker}
      - CHEGE_DOCKER_SOCKET_PROXY=${CHEGE_DOCKER_SOCKET_PROXY:-tcp://docker-socket-proxy:2375}
      - CHEGE_DEFAULT_SANDBOX_IMAGE=${CHEGE_DEFAULT_SANDBOX_IMAGE:-chege-agent-sandbox-polyglot:latest}
      - CHEGE_SANDBOX_CONTAINER_PREFIX=${CHEGE_SANDBOX_CONTAINER_PREFIX:-chege-agent-sandbox}
      - CHEGE_DEFAULT_PROVIDER=${CHEGE_DEFAULT_PROVIDER:-llama_cpp}
      - CHEGE_LLAMACPP_URL=http://host.docker.internal:8080/v1
      - CHEGE_LLAMACPP_CONTROL_URL=http://host.docker.internal:8081
      - CHEGE_LLAMACPP_MODEL=${CHEGE_LLAMACPP_MODEL:-}
      - CHEGE_LLAMACPP_CTX=${CHEGE_LLAMACPP_CTX:-8192}
      - CHEGE_OLLAMA_URL=http://host.docker.internal:11434
      - CHEGE_OLLAMA_MODEL=${CHEGE_OLLAMA_MODEL:-}
      - CHEGE_OLLAMA_NUM_CTX=${CHEGE_OLLAMA_NUM_CTX:-8192}
      - CHEGE_OLLAMA_KEEP_ALIVE=${CHEGE_OLLAMA_KEEP_ALIVE:-15m}
      - CHEGE_OPENAI_BASE_URL=${CHEGE_OPENAI_BASE_URL:-https://api.openai.com/v1}
      - CHEGE_OPENAI_API_KEY=${CHEGE_OPENAI_API_KEY:-}
      # Optional cloud-provider fallbacks. Tokens saved in Settings take
      # precedence; these are only used when a profile has no token.
      - CHEGE_DEEPSEEK_API_KEY=${CHEGE_DEEPSEEK_API_KEY:-}
      - CHEGE_GEMINI_API_KEY=${CHEGE_GEMINI_API_KEY:-}
      - CHEGE_GROK_API_KEY=${CHEGE_GROK_API_KEY:-}
      - CHEGE_ANTHROPIC_API_KEY=${CHEGE_ANTHROPIC_API_KEY:-}
      - CHEGE_MISTRAL_API_KEY=${CHEGE_MISTRAL_API_KEY:-}
      - CHEGE_GROQ_API_KEY=${CHEGE_GROQ_API_KEY:-}
      - CHEGE_OPENROUTER_API_KEY=${CHEGE_OPENROUTER_API_KEY:-}
      - CHEGE_TOGETHER_API_KEY=${CHEGE_TOGETHER_API_KEY:-}
      - CHEGE_PERPLEXITY_API_KEY=${CHEGE_PERPLEXITY_API_KEY:-}
      - CHEGE_DEFAULT_CONTEXT_WINDOW=${CHEGE_DEFAULT_CONTEXT_WINDOW:-8192}
      - CHEGE_DEFAULT_TEMPERATURE=${CHEGE_DEFAULT_TEMPERATURE:-0.2}
      - CHEGE_DEFAULT_TOP_P=${CHEGE_DEFAULT_TOP_P:-0.9}
      - CHEGE_MAX_STEPS=${CHEGE_MAX_STEPS:-50}
      - CHEGE_RUN_TIMEOUT_SECONDS=${CHEGE_RUN_TIMEOUT_SECONDS:-600}
      - CHEGE_PROVIDER_TIMEOUT_SECONDS=${CHEGE_PROVIDER_TIMEOUT_SECONDS:-120}
    volumes:
      # Persistent application data and workspace directories
      - ./data:/app/data
      - ./workdir:/app/workdir
      - ./logs:/app/logs
    depends_on:
      - docker-socket-proxy
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chege-net

networks:
  chege-net:
    driver: bridge
