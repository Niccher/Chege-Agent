version: '3.8'

services:
  chege-agent:
    build: .
    image: chege-agent:dev
    container_name: chege-agent-dev
    ports:
      - "127.0.0.1:9100:9100"
    environment:
      - CHEGE_HOST=0.0.0.0
      - CHEGE_PORT=9100
      - CHEGE_DATA_DIR=/app/data
      - CHEGE_WORKDIR=/app/workdir
      - CHEGE_LOGS_DIR=/app/logs
      - CHEGE_SANDBOX_BACKEND=local
      - CHEGE_OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      # Live development mounts with hot reload
      - ./backend:/app/backend
      - ./webui:/app/webui
      - ./data:/app/data
      - ./workdir:/app/workdir
      - ./logs:/app/logs
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "9100", "--reload", "--reload-dir", "/app/backend", "--reload-dir", "/app/webui"]
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
